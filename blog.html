---
layout: default
title: Blogs
---
<div class="mb-6">
  <h1 class="text-4xl font-bold text-flexoki-text tracking-tight">Blogs</h1>
  <p class="mt-2 text-xs font-bold uppercase tracking-[0.25em] font-mono text-flexoki-muted whitespace-nowrap">
    What I think?
  </p>
</div>

<div class="space-y-8">
  {% for post in site.posts %}
  <article>
    <a href="{{ post.url | relative_url }}"
      class="block p-5 rounded-lg border border-flexoki-muted bg-flexoki-paper/30 transition-colors group hover:border-flexoki-text">
      <div class="flex flex-col md:flex-row md:justify-between md:items-baseline mb-2">
        <h2 class="text-2xl font-bold text-flexoki-text transition-colors flex items-center tracking-tight">
          {{ post.title }}
          <span class="ml-2 opacity-0 group-hover:opacity-100 transition-opacity font-mono">&rarr;</span>
        </h2>
        <time class="text-sm text-flexoki-muted shrink-0 md:ml-4 font-mono tracking-wider"
          datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%B %d, %Y" }}
        </time>
      </div>
      {% if post.description %}
      <p class="text-flexoki-muted text-sm leading-relaxed max-w-2xl">
        {{ post.description }}
      </p>
      {% endif %}
    </a>
  </article>
  {% endfor %}
</div>
