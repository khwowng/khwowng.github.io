---
layout: default
---
<article class="prose">
  <header class="mb-12 border-b border-flexoki-ui pb-8">
    <h1 class="text-4xl font-bold mb-4 tracking-tight">{{ page.title }}</h1>
    <div class="text-sm font-bold uppercase tracking-widest text-flexoki-muted">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
    </div>
  </header>
  
  {{ content }}
</article>
